imagePullSecrets:
  - name: harbor-cred

backend:
  image:
    repository: harbor.local/search-app/search-backend
    tag: 1.0.1
  replicas: 1

frontend:
  image:
    repository: harbor.local/search-app/search-frontend
    tag: 1.0.1
  replicas: 1
  config:
    oidc:
      enabled: true
      url: http://keycloak.prod.cluster.local:8080
      realm: Demo
      clientId: search-app
      baseUrl: https://search-app.local 

  ingress:
  enabled: true
  hostname: search-app.local
  tls:
    enabled: true
    secretName: search-app-tls
