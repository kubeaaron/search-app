apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-opensearch-dashboards
  labels:
    app: {{ .Release.Name }}-opensearch-dashboards
spec:
  replicas: {{ .Values.opensearchDashboards.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-opensearch-dashboards
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-opensearch-dashboards
    spec:
      containers:
        - name: opensearch-dashboards
          image: {{ .Values.opensearchDashboards.image }}
          ports:
            - containerPort: 5601
          env:
            - name: OPENSEARCH_HOSTS
              value: "http://{{ .Release.Name }}-opensearch:9200"
            - name: OPENSEARCH_SECURITY_ENABLED
              value: "false"
            - name: DISABLE_SECURITY_DASHBOARDS_PLUGIN
              value: "true"