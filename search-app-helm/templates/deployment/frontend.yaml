apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}
          ports:
            - containerPort: 80
          env:
            - name: VITE_OIDC_ENABLED
              value: "{{ .Values.frontend.config.oidc.enabled }}"
            - name: VITE_OIDC_URL
              value: "{{ .Values.frontend.config.oidc.url }}"
            - name: VITE_OIDC_REALM
              value: "{{ .Values.frontend.config.oidc.realm }}"
            - name: VITE_OIDC_CLIENT_ID
              value: "{{ .Values.frontend.config.oidc.clientId }}"
            {{- if .Values.frontend.config.oidc.baseUrl }}
            - name: VITE_OIDC_BASE_URL
              value: "{{ .Values.frontend.config.oidc.baseUrl }}"
            {{- end }}
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config-volume
          configMap:
            name: search-app-nginx-config
            items:
              - key: default.conf
                path: default.conf
